spring:
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: false
        cors-configurations:
          '[/**]': # 匹配所有请求
            allowedHeaders: "*"
            allowedOrigins:
              - "http://localhost:8801"
              - "http://127.0.0.1:8801"
              - "http://localhost:8080"
              - "http://127.0.0.1:8080"
              - "http://localhost:9000"
              - "http://127.0.0.1:9000"
            allowCredentials: true
            allowedMethods: # 支持的方法
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
      routes:
        # 用户微服务
        - id: user
          uri: lb://leadnews-user
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix= 1
        # 文章微服务
        - id: article
          uri: lb://leadnews-article
          predicates:
            - Path=/article/**
          filters:
            - StripPrefix= 1
        #搜索微服务
        - id: leadnews-search
          uri: lb://leadnews-search
          predicates:
             - Path=/search/**
          filters:
             - StripPrefix= 1
        #行为微服务
        - id: behavior
          uri: lb://leadnews-behavior
          predicates:
            - Path=/behavior/**
          filters:
            - StripPrefix= 1
